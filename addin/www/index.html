<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fusion 360 AR</title>
    <style>
        body { margin: 0; background: #222; overflow: hidden; font-family: sans-serif; }
        #status { position: absolute; top: 12px; left: 12px; color: #ddd; font: 14px monospace; white-space: pre; pointer-events: none; }
    </style>
</head>
<body>
    <div id="status"></div>

    <!-- Three.js liegt lokal unter vendor/, damit alles ohne Internet läuft -->
    <script type="importmap">
        {
            "imports": {
                "three": "./vendor/three/build/three.module.js",
                "three/addons/": "./vendor/three/addons/"
            }
        }
    </script>
    <script type="module" src="./app/main.js"></script>
</body>
</html>
