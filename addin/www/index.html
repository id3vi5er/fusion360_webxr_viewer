<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fusion 360 AR</title>
    <style>
        body { margin: 0; background: #222; overflow: hidden; font-family: sans-serif; }
        #status { position: absolute; top: 12px; left: 12px; color: #ddd; font: 14px monospace; white-space: pre; pointer-events: none; }
    </style>
</head>
<body>
    <div id="status"></div>

    <!-- Three.js liegt lokal unter vendor/, damit alles ohne Internet läuft -->
    <script type="importmap">
        {
            "imports": {
                "three": "./vendor/three/build/three.module.js",
                "three/addons/": "./vendor/three/addons/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        // Gamepad-Belegung (xr-standard): 4 = A/X, 5 = B/Y
        const BTN_DEBUG = 4;
        const BTN_RESET = 5;
        const POLL_MS = 2000;           // nur als Rückfall, solange keine SSE-Verbindung steht
        const SPAWN_DISTANCE = 0.6;
        const SPAWN_WAIT_FRAMES = 30;   // Kopfposition stabilisiert sich erst nach einigen Frames

        let scene, camera, renderer;
        // modelGroup trägt Position, Drehung und Maßstab; content zentriert das Modell darin,
        // dadurch bleibt der Griffpunkt beim Skalieren stehen
        let modelGroup, content;
        let controller1, controller2;

        let sceneMeta = null;
        let latestMeta = null;          // neuester bekannter Stand vom Server
        let loadedVersion = null;
        let loading = false;
        let sseConnected = false;
        let modelRadius = 0.1;          // in Metern bei Maßstab 1

        let baseScale = 1;              // GLB: Meter -> 1, OBJ: cm -> 0.01
        let userScale = 1;
        let spawnFrames = -1;           // >= 0: Platzierung ausstehend

        // State
        const activeControllers = new Set();
        const grabOffset = { pos: new THREE.Vector3(), rot: new THREE.Quaternion() };
        let initialDistance = 0;
        let initialUserScale = 1;
        const prevButtons = new Map();

        // Debug Panel
        let debugMesh, debugCtx, debugCanvas;
        let statusLine = 'Starte...';

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = null;

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 50);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Umgebungslicht für Metall und Glas, dazu ein Richtungslicht für Kontrast
            const pmrem = new THREE.PMREMGenerator(renderer);
            scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(2, 5, 2);
            scene.add(dirLight);

            modelGroup = new THREE.Group();
            modelGroup.position.set(0, 0, -1);
            scene.add(modelGroup);
            content = new THREE.Group();
            modelGroup.add(content);

            createDebugPanel();

            const arBtn = ARButton.createButton(renderer, { optionalFeatures: ['local-floor', 'hit-test'] });
            document.body.appendChild(arBtn);

            // Controller
            function setupController(idx) {
                const ctrl = renderer.xr.getController(idx);
                ctrl.addEventListener('selectstart', onSelectStart);
                ctrl.addEventListener('selectend', onSelectEnd);

                const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-0.05)]);
                const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xffffff }));
                ctrl.add(line);
                ctrl.userData.line = line;

                scene.add(ctrl);
                return ctrl;
            }

            controller1 = setupController(0);
            controller2 = setupController(1);

            renderer.xr.addEventListener('sessionstart', () => { spawnFrames = 0; });
            renderer.xr.addEventListener('sessionend', () => { frameDesktopCamera(); });

            // Zugriff für Debugging in der Browser-Konsole
            window.__viewer = { scene, camera, modelGroup, content, renderer };
            checkForUpdates();
            connectEvents();
            setInterval(() => { if (!sseConnected) checkForUpdates(); }, POLL_MS);
            window.addEventListener('resize', onWindowResize);
        }

        // ---------------------------------------------------------------------
        // Debug-Panel (A/X blendet es ein und aus)
        // ---------------------------------------------------------------------
        function createDebugPanel() {
            debugCanvas = document.createElement('canvas');
            debugCanvas.width = 640;
            debugCanvas.height = 200;
            debugCtx = debugCanvas.getContext('2d');
            const tex = new THREE.CanvasTexture(debugCanvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.9, depthTest: false });
            const geo = new THREE.PlaneGeometry(0.32, 0.1);
            debugMesh = new THREE.Mesh(geo, mat);
            debugMesh.renderOrder = 999;
            scene.add(debugMesh);
            redrawDebug();
        }

        function scaleLabel() {
            const s = baseScale * userScale * (sceneMeta && sceneMeta.format === 'obj' ? 100 : 1);
            if (Math.abs(s - 1) < 0.005) return '1:1';
            return s < 1 ? `1:${(1 / s).toFixed(s > 0.1 ? 1 : 0)}` : `${s.toFixed(s < 10 ? 1 : 0)}:1`;
        }

        function redrawDebug() {
            const lines = [statusLine];
            if (sceneMeta) {
                lines.push(sceneMeta.document || '');
                if (sceneMeta.format === 'glb') {
                    lines.push(`${sceneMeta.bodies.length} Körper · ${sceneMeta.triangles.toLocaleString('de-DE')} Dreiecke`);
                } else {
                    lines.push('OBJ-Export (Maßstab angenommen: cm)');
                }
                lines.push(`Maßstab ${scaleLabel()}`);
            }
            debugCtx.clearRect(0, 0, debugCanvas.width, debugCanvas.height);
            debugCtx.fillStyle = 'rgba(10,10,10,0.8)';
            debugCtx.fillRect(0, 0, debugCanvas.width, debugCanvas.height);
            debugCtx.fillStyle = '#00ff00';
            debugCtx.font = '28px monospace';
            lines.forEach((l, i) => debugCtx.fillText(l, 20, 42 + i * 44));
            debugMesh.material.map.needsUpdate = true;
            document.getElementById('status').textContent = lines.join('\n');
        }

        function updateDebugText(text) {
            statusLine = text;
            redrawDebug();
        }

        // ---------------------------------------------------------------------
        // Greifen und Skalieren
        // ---------------------------------------------------------------------
        function onSelectStart(event) {
            const ctrl = event.target;
            activeControllers.add(ctrl);
            if(ctrl.userData.line) ctrl.userData.line.material.color.set(0x00ff00);
            updateGrabState();
        }

        function onSelectEnd(event) {
            const ctrl = event.target;
            activeControllers.delete(ctrl);
            if(ctrl.userData.line) ctrl.userData.line.material.color.set(0xffffff);
            updateGrabState();
        }

        function updateGrabState() {
            const ctrls = Array.from(activeControllers);

            if (ctrls.length === 1) {
                const ctrl = ctrls[0];
                const invCtrlRot = ctrl.quaternion.clone().invert();

                grabOffset.pos.copy(modelGroup.position).sub(ctrl.position).applyQuaternion(invCtrlRot);
                grabOffset.rot.copy(invCtrlRot).multiply(modelGroup.quaternion);
                updateDebugText("Grab: 1 Hand");
            }
            else if (ctrls.length === 2) {
                initialDistance = ctrls[0].position.distanceTo(ctrls[1].position);
                initialUserScale = userScale;

                const midPoint = new THREE.Vector3().addVectors(ctrls[0].position, ctrls[1].position).multiplyScalar(0.5);
                const invRefRot = ctrls[0].quaternion.clone().invert();

                grabOffset.pos.copy(modelGroup.position).sub(midPoint).applyQuaternion(invRefRot);
                grabOffset.rot.copy(invRefRot).multiply(modelGroup.quaternion);
                updateDebugText("Scale: 2 Hands");
            } else {
                updateDebugText("Ready");
            }
        }

        function applyScale() {
            const s = baseScale * userScale;
            modelGroup.scale.set(s, s, s);
        }

        // ---------------------------------------------------------------------
        // Laden
        // ---------------------------------------------------------------------
        // Fusion meldet Exporte per Server-Sent Events; Polling nur, solange das nicht klappt
        function connectEvents() {
            if (!window.EventSource) return;
            const es = new EventSource('./events');
            es.onopen = () => { sseConnected = true; checkForUpdates(); };
            es.onerror = () => { sseConnected = false; };
            es.addEventListener('exporting', () => updateDebugText('Fusion exportiert...'));
            es.addEventListener('scene', () => checkForUpdates());
            // Eigener Name, weil 'error' bei EventSource für Verbindungsfehler reserviert ist
            es.addEventListener('exporterror', e => {
                updateDebugText(JSON.parse(e.data).message);
                debugMesh.visible = true;
            });
        }

        async function checkForUpdates() {
            let meta;
            try {
                const res = await fetch('./scene.json', { cache: 'no-store' });
                if (!res.ok) {
                    if (!sceneMeta) updateDebugText("Noch kein Export - in Fusion 'WebXR Export'");
                    return;
                }
                meta = await res.json();
            } catch (e) {
                updateDebugText("Server nicht erreichbar");
                return;
            }
            latestMeta = meta;
            if (!loading) processQueue();
        }

        // Lädt so lange nach, bis der neueste Stand angezeigt wird – Exporte während
        // eines laufenden Ladevorgangs gehen so nicht verloren
        async function processQueue() {
            loading = true;
            while (latestMeta && latestMeta.version !== loadedVersion) {
                const meta = latestMeta;
                updateDebugText(`Lade ${meta.format.toUpperCase()}...`);
                try {
                    const obj = meta.format === 'glb' ? await loadGlb(meta) : await loadObj(meta);
                    setContent(obj, meta);
                    updateDebugText("Modell geladen");
                } catch (e) {
                    console.error(e);
                    updateDebugText(`Fehler beim Laden (${meta.format})`);
                    debugMesh.visible = true;
                }
                loadedVersion = meta.version;
            }
            loading = false;
        }

        function loadGlb(meta) {
            return new Promise((resolve, reject) => {
                new GLTFLoader().load(`./${meta.file}?v=${meta.version}`, gltf => {
                    gltf.scene.traverse(c => {
                        // Polierte Metalle spiegeln sonst nur die künstliche Umgebung und wirken fast schwarz
                        if (c.isMesh && c.material.metalness > 0.5) {
                            c.material.roughness = Math.max(c.material.roughness, 0.35);
                            c.material.envMapIntensity = 1.5;
                        }
                    });
                    resolve(gltf.scene);
                }, undefined, reject);
            });
        }

        function loadObj(meta) {
            const objUrl = `./model.obj?v=${meta.version}`;
            return new Promise((resolve, reject) => {
                const loadGeometry = (materials) => {
                    const loader = new OBJLoader();
                    if (materials) loader.setMaterials(materials);
                    loader.load(objUrl, obj => {
                        if (!materials) obj.traverse(c => { if (c.isMesh) c.material = new THREE.MeshStandardMaterial({ color: 0xcccccc }); });
                        resolve(obj);
                    }, undefined, reject);
                };
                if (!meta.hasMtl) return loadGeometry(null);
                new MTLLoader().load(`./model.mtl?v=${meta.version}`, materials => {
                    materials.preload();
                    loadGeometry(materials);
                }, undefined, () => loadGeometry(null));
            });
        }

        function disposeObject(obj) {
            obj.traverse(c => {
                if (c.geometry) c.geometry.dispose();
                if (c.material) [].concat(c.material).forEach(m => m.dispose());
            });
        }

        function setContent(obj, meta) {
            const firstLoad = !sceneMeta;
            // Nur beim ersten Laden, nach Dokumentwechsel oder Formatwechsel neu zentrieren.
            // Sonst bleibt der Fusion-Ursprung stehen und vorhandene Geometrie springt nicht,
            // wenn etwas dazukommt.
            const recenter = firstLoad || meta.document !== sceneMeta.document || meta.format !== sceneMeta.format;
            while (content.children.length) {
                const old = content.children[0];
                content.remove(old);
                disposeObject(old);
            }
            // Hüllquader im lokalen (unskalierten) Raum von modelGroup berechnen,
            // solange obj noch keinen Elternknoten hat
            obj.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(obj);
            if (recenter) content.position.copy(box.getCenter(new THREE.Vector3())).negate();
            content.add(obj);

            baseScale = meta.format === 'obj' ? 0.01 : 1;
            sceneMeta = meta;
            applyScale();
            modelRadius = Math.max(box.getSize(new THREE.Vector3()).length() / 2, 0.001) * baseScale;

            if (firstLoad && !renderer.xr.isPresenting) frameDesktopCamera();
        }

        // ---------------------------------------------------------------------
        // Platzierung und Reset
        // ---------------------------------------------------------------------
        function spawnInFront() {
            const camPos = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0;
            if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
            dir.normalize();
            const distance = Math.max(SPAWN_DISTANCE, modelRadius * userScale * 2.5);
            modelGroup.position.copy(camPos).add(dir.multiplyScalar(distance));
            modelGroup.quaternion.identity();
            modelGroup.lookAt(camPos.x, modelGroup.position.y, camPos.z);
        }

        function recenterContent() {
            const obj = content.children[0];
            if (!obj) return;
            content.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(obj);
            // setFromObject rechnet in Weltkoordinaten – zurück in den lokalen Raum von content
            box.applyMatrix4(content.matrixWorld.clone().invert());
            content.position.copy(box.getCenter(new THREE.Vector3())).negate();
        }

        function resetView() {
            recenterContent();
            userScale = 1;
            applyScale();
            spawnInFront();
            updateDebugText("Reset");
        }

        function frameDesktopCamera() {
            // Nur für die Desktop-Vorschau ohne Headset
            camera.position.set(0, modelRadius * 0.8, modelGroup.position.z + modelRadius * 3);
            camera.lookAt(modelGroup.position);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function handleInput() {
            const session = renderer.xr.getSession();
            if (!session) return;
            for (const source of session.inputSources) {
                if (!source.gamepad) continue;
                const buttons = source.gamepad.buttons;
                const prev = prevButtons.get(source) || [];
                // Nur auf das Drücken reagieren, nicht solange die Taste gehalten wird
                const pressed = idx => buttons[idx] && buttons[idx].pressed && !prev[idx];
                if (pressed(BTN_RESET)) resetView();
                if (pressed(BTN_DEBUG)) debugMesh.visible = !debugMesh.visible;
                prevButtons.set(source, buttons.map(b => b.pressed));
            }
        }

        function animate() {
            renderer.setAnimationLoop(() => {
                if (debugMesh && camera) {
                    const offset = new THREE.Vector3(-0.15, 0.1, -0.5);
                    offset.applyQuaternion(camera.quaternion);
                    debugMesh.position.copy(camera.position).add(offset);
                    debugMesh.quaternion.copy(camera.quaternion);
                }

                if (renderer.xr.isPresenting && spawnFrames >= 0) {
                    if (++spawnFrames > SPAWN_WAIT_FRAMES) {
                        spawnInFront();
                        spawnFrames = -1;
                    }
                }

                handleInput();

                const ctrls = Array.from(activeControllers);
                if (ctrls.length === 1) {
                    const ctrl = ctrls[0];
                    const rotOffset = grabOffset.pos.clone().applyQuaternion(ctrl.quaternion);
                    modelGroup.position.copy(ctrl.position).add(rotOffset);
                    modelGroup.quaternion.copy(ctrl.quaternion).multiply(grabOffset.rot);
                }
                else if (ctrls.length === 2) {
                    const c1 = ctrls[0];
                    const c2 = ctrls[1];
                    const currentDist = c1.position.distanceTo(c2.position);
                    const newUserScale = THREE.MathUtils.clamp(initialUserScale * currentDist / initialDistance, 0.01, 100);
                    if (Math.abs(newUserScale - userScale) > 1e-4) {
                        userScale = newUserScale;
                        applyScale();
                        redrawDebug();
                    }

                    const midPoint = new THREE.Vector3().addVectors(c1.position, c2.position).multiplyScalar(0.5);
                    const refRot = c1.quaternion;
                    // Offset mitskalieren, damit der Griffpunkt zwischen den Händen bleibt
                    const rotOffset = grabOffset.pos.clone().multiplyScalar(userScale / initialUserScale).applyQuaternion(refRot);
                    modelGroup.position.copy(midPoint).add(rotOffset);
                    modelGroup.quaternion.copy(refRot).multiply(grabOffset.rot);
                }

                renderer.render(scene, camera);
            });
        }
    </script>
</body>
</html>
